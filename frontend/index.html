<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('Redrep could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('Redrep could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'Redrep could not start on this browser.' : 'Redrep is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>Redrep</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Redrep">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the logo loading its plates instead of a black
     page. Same dark and red as the native splash. lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#000;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:112px;height:auto;overflow:visible}
  #boot g,#boot ellipse{transform-box:fill-box;transform-origin:center}
  #boot .logo{animation:boot-in .3s cubic-bezier(.3,.7,.4,1.3) both}
  #boot .db{animation:boot-rep 1.25s ease-in-out .75s infinite}
  #boot ellipse{fill:#c70200;opacity:.12;animation:boot-shadow 1.25s ease-in-out .75s infinite}
  @keyframes boot-in{from{transform:scale(.6);opacity:0}}
  @keyframes boot-rep{50%{transform:translateY(-90px)}}
  @keyframes boot-shadow{50%{transform:scaleX(.72);opacity:.05}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e6e8ec;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#1a1d24;color:#a9b0bc;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#0c0e12;background:#ff1f2f;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){
    #boot .logo,#boot ellipse{animation:none}
    #boot .db{animation:boot-breathe 1.6s ease-in-out infinite}
    @keyframes boot-breathe{50%{opacity:.55}}
  }
</style>
<div id="boot" aria-hidden="true">
  <!-- logo: written by scripts/app-icons.mjs from resources/logo.png, do not edit -->
  <svg viewBox="-40 -40 924 877">
    <ellipse cx="422" cy="807" rx="354" ry="22"/>
    <g class="db"><g class="logo" fill="#c70200"><path fill-rule="evenodd" d="M250 0L279 2L330 28L379 59L392 72L394 81L353 74L319 74L279 81L243 94L211 112L183 134L132 193L110 233L95 277L86 320L84 363L88 400L93 416L104 435L126 455L155 470L167 473L167 477L136 475L110 464L77 439L31 397L13 375L4 349L0 325L0 274L6 234L20 190L39 151L70 105L99 72L136 41L162 26L213 6ZM652 219L680 219L698 226L792 279L823 306L834 321L844 344L839 345L822 332L786 314L763 310L729 310L710 314L671 332L631 358L584 402L546 451L497 536L484 568L475 602L468 662L473 690L493 715L520 736L544 745L562 745L565 751L526 757L475 752L458 743L401 697L361 659L352 643L354 550L372 476L385 442L418 381L451 337L473 314L495 294L544 259L619 226ZM257 224L266 224L297 239L352 270L399 292L448 321L446 327L431 341L409 371L389 409L384 409L366 398L216 291L216 270L225 250L238 235ZM728 391L757 402L798 428L825 451L826 457L816 459L802 455L783 455L757 459L737 466L708 484L682 507L664 528L645 556L629 592L625 624L629 653L643 670L660 677L685 675L707 668L728 657L731 657L731 661L713 679L682 697L653 703L622 701L583 671L542 631L543 596L552 555L581 495L610 457L627 440L647 422L677 404L703 395Z"/></g></g>
  </svg>
  <!-- end of logo -->
</div>
